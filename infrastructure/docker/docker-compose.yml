services:
  postgres:
    image: postgres:15-alpine
    container_name: idp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - idp_network

  backstage:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: idp-backstage
    ports:
      - "7007:7007"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-backstage}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-backstage}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - K8S_CLUSTER_URL=${K8S_CLUSTER_URL}
      - K8S_SERVICE_ACCOUNT_TOKEN=${K8S_SERVICE_ACCOUNT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7007/ -o /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - idp_network

volumes:
  postgres_data:
    driver: local

networks:
  idp_network:
    driver: bridge
