name: CI — IDP Platform Engineering

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Validação de configuração e lint
  # ---------------------------------------------------------------------------
  validate:
    name: Validar Configurações
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar YAML (app-config)
        run: |
          python3 -c "
          import yaml, sys
          for f in ['app-config.yaml', 'app-config.production.yaml', 'catalog-info.yaml', 'mkdocs.yml']:
              try:
                  yaml.safe_load(open(f))
                  print(f'  ✅ {f}')
              except Exception as e:
                  print(f'  ❌ {f}: {e}')
                  sys.exit(1)
          "

      - name: Validar Template YAML
        run: |
          python3 -c "
          import yaml
          yaml.safe_load(open('templates/python-microservice-path/template.yaml'))
          print('  ✅ template.yaml')
          "

  # ---------------------------------------------------------------------------
  # Job 2: Build e teste do Docker
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript check
        run: yarn tsc

      - name: Build backend
        run: yarn build:backend

      - name: Build Docker Image
        working-directory: infrastructure/docker
        run: docker compose build

      - name: Start services
        working-directory: infrastructure/docker
        run: |
          # Cria .env mínimo para CI
          echo "GITHUB_TOKEN=ghp_ci_placeholder" > .env
          docker compose up -d

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7007/ > /dev/null 2>&1; then
              echo "✅ Backstage is healthy!"
              exit 0
            fi
            echo "Waiting for Backstage... ($i/30)"
            sleep 5
          done
          echo "❌ Backstage did not become healthy in time"
          docker compose -f infrastructure/docker/docker-compose.yml logs
          exit 1

      - name: Cleanup
        if: always()
        working-directory: infrastructure/docker
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Job 3: Security scan com Trivy
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install & Build
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:backend

      - name: Build Docker image
        working-directory: infrastructure/docker
        run: docker compose build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'infrastructure-docker-backstage:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
